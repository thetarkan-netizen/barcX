<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>barcX Sayım</title><style>body{font:16px system-ui;background:#101c29;color:#fff;max-width:700px;margin:auto;padding:16px}section{background:#203243;border-radius:12px;padding:16px;margin:12px 0}input,button,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;font:inherit;border-radius:8px}input,select{background:#102333;color:white;border:1px solid #667}button{background:#36bdc4;border:0;font-weight:bold}label{display:block;margin-top:8px}small{color:#bacbd5}li{padding:6px;border-bottom:1px solid #567}</style><h1>barcX • Depo Sayım</h1><small>Depo → Lokasyon → Kalem Kodu → Date Code / UPN / Manufacturer</small><section><h3>1. Ana veri yükle</h3><input type="file" id="file"><button id="load">CSV içe aktar</button><p id="status">Depo;Lokasyon;Kalem Kodu sütunları kullanılacak.</p></section><section><h3>2. Sayım</h3><p id="session"></p><button id="new">Yeni sayım başlat</button><label>Depo</label><input id="depo" list="ds"><datalist id="ds"></datalist><label>Lokasyon</label><input id="lok" list="ls"><datalist id="ls"></datalist><label>Kalem Kodu</label><input id="kalem" list="ks"><datalist id="ks"></datalist><label>Date Code</label><input id="datecode"><label>UPN</label><input id="upn"><label>Manufacturer</label><input id="manufacturer"><button id="save">Kaydet</button><p id="message"></p></section><section><h3>Kayıtlar <span id="total"></span></h3><button id="export">Sayım CSV indir</button><ul id="list"></ul></section><script>
const $=id=>document.getElementById(id);let db,session='',master=[];const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});const done=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
function fill(id,values){$(id).replaceChildren(...[...new Set(values)].sort().map(x=>new Option(x,x)))}
function options(){fill('ds',master.map(x=>x.depo));let m=master.filter(x=>x.depo===$('depo').value.trim());fill('ls',m.map(x=>x.lok));fill('ks',m.filter(x=>x.lok===$('lok').value.trim()).map(x=>x.kalem))}
async function init(){db=await new Promise((ok,no)=>{let r=indexedDB.open('barcx-web-v2',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('master',{keyPath:'id'});d.createObjectStore('counts',{keyPath:'id',autoIncrement:true}).createIndex('session','session');d.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});master=await rq(db.transaction('master').objectStore('master').getAll());let v=await rq(db.transaction('meta').objectStore('meta').get('session'));if(v)session=v.value;else await newSession(false);$('status').textContent=master.length+' stok ana veri kaydı';$('session').textContent='Aktif: '+session;options();await render()}
async function newSession(confirmFirst=true){if(confirmFirst&&!confirm('Yeni boş sayım başlatılsın mı? Önceki sayımlar korunur.'))return;session='SAYIM-'+Date.now();let t=db.transaction('meta','readwrite');t.objectStore('meta').put({key:'session',value:session});await done(t);$('session').textContent='Aktif: '+session;$('message').textContent='Yeni sayım açıldı';await render()}
async function importCsv(){let file=$('file').files[0];if(!file){alert('Önce CSV dosyası seçin');return}let text=await file.text();let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);let sep=lines[0].includes(';')?';':',';let h=lines[0].split(sep).map(s=>s.trim().toLocaleLowerCase('tr'));let ix=['depo','lokasyon','kalem kodu'].map(s=>h.indexOf(s));if(ix.some(i=>i<0)){alert('CSV başlıkları: Depo;Lokasyon;Kalem Kodu');return}let map=new Map();for(let i=1;i<lines.length;i++){let p=lines[i].split(sep),[depo,lok,kalem]=ix.map(j=>(p[j]||'').trim());if(depo&&lok&&kalem){let id=JSON.stringify([depo,lok,kalem]);map.set(id,{id,depo,lok,kalem})}}if(!confirm(map.size+' kayıt yüklensin mi?'))return;let t=db.transaction('master','readwrite');t.objectStore('master').clear();await done(t);master=[...map.values()];for(let i=0;i<master.length;i+=400){t=db.transaction('master','readwrite');let s=t.objectStore('master');master.slice(i,i+400).forEach(x=>s.put(x));await done(t);$('status').textContent='Aktarılıyor: '+Math.min(i+400,master.length)+' / '+master.length}options();$('status').textContent=master.length+' kayıt yüklendi'}
async function rows(){return rq(db.transaction('counts').objectStore('counts').index('session').getAll(session))}
async function render(){let data=await rows();$('total').textContent='('+data.length+')';$('list').replaceChildren(...data.slice(-100).reverse().map(r=>{let li=document.createElement('li');li.textContent=[r.depo,r.lok,r.kalem,r.datecode,r.upn,r.manufacturer ].join(' | ');return li}))}
async function save(){let depo=$('depo').value.trim(),lok=$('lok').value.trim(),kalem=$('kalem').value.trim();if(!depo||!lok||!kalem){alert('Depo, lokasyon, kalem gerekli');return}if(!master.some(x=>x.depo===depo&&x.lok===lok&&x.kalem===kalem)){alert('Depo/lokasyon/kalem eşleşmesi ana veride yok');return}let r={session,depo,lok,kalem,datecode:$('datecode').value.trim(),upn:$('upn').value.trim(),manufacturer:$('manufacturer').value.trim()};let t=db.transaction('counts','readwrite');t.objectStore('counts').add(r);await done(t);['datecode','upn','manufacturer'].forEach(x=>$(x).value='');$('message').textContent='Kaydedildi';await render()}
async function exportCsv(){let data=await rows(),head=['Depo','Lokasyon','Kalem Kodu','Date Code','UPN','Manufacturer' ];let esc=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let content=[head,...data.map(r=>[r.depo,r.lok,r.kalem,r.datecode,r.upn,r.manufacturer,r.adet])].map(r=>r.map(esc).join(';')).join('\r\n');let u=URL.createObjectURL(new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download=session+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('load').onclick=()=>importCsv().catch(e=>alert('CSV hatası: '+e.message));$('new').onclick=()=>newSession();$('depo').onchange=options;$('lok').onchange=options;$('save').onclick=()=>save().catch(e=>alert(e.message));$('export').onclick=exportCsv;init().catch(e=>alert('Başlatma hatası: '+e.message));
</script></html>
