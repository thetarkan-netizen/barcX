<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>barcX Kamera Testi</title>
<style>body{font:16px system-ui;background:#101820;color:#f2f7fc;max-width:600px;margin:auto;padding:18px}button,input,select{font:inherit;border-radius:9px;padding:12px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#29bcc4;color:#071319;font-weight:bold;border:0}input,select{background:#263744;color:white;border:1px solid #526370}section{background:#1f303c;border-radius:14px;padding:15px;margin:14px 0}small{color:#aec3cb}#reader{max-width:100%;overflow:hidden}li{padding:6px;border-bottom:1px solid #465460}</style></head>
<body><h1>barcX • Kör Sayım</h1><small>HTTPS kamera testi • Raf barkodu 123 • Lokasyon a1-1 • A–J stokları</small>
<section><h3>1. Raf okut</h3><input id="raf" placeholder="Raf barkodu" inputmode="numeric"><button onclick="kamera('raf')">📷 Raf barkodunu okut</button><button onclick="rafAc()">Rafı aç</button><p id="rafDurum"></p></section>
<section id="sayim" hidden><h3>2. Malzeme sayımı</h3><label>Stok</label><select id="stok"></select><label>KRL barkodu</label><input id="krl" placeholder="KRL benzersiz barkod"><button onclick="kamera('krl')">📷 KRL barkodu okut</button><label>Fiziki adet</label><input id="adet" inputmode="numeric" type="number" min="0" placeholder="Adet"><button onclick="kaydet()">Kaydet</button><p id="sonuc"></p></section>
<section id="kameraBolum" hidden><h3>Kamera</h3><div id="reader"></div><button onclick="kapat()">Kamerayı kapat</button><small>Tarayıcı izin isterse kameraya izin verin.</small></section>
<section><h3>Kayıtlar <span id="toplam"></span></h3><ul id="liste"></ul><button onclick="csv()">CSV dışa aktar</button></section>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);const stocks='ABCDEFGHIJ'.split('');let reader=null,target='',records=[];
try{records=JSON.parse(localStorage.getItem('barcxSayim123')||'[]')}catch(e){}
$('stok').innerHTML=stocks.map(s=>'<option>'+s+'</option>').join('');
function rafAc(){if($('raf').value.trim()!=='123'){alert('Raf bulunamadı. Test barkodu: 123');return}$('rafDurum').textContent='Raf 123 • Lokasyon a1-1 • 10 stok';$('sayim').hidden=false}
async function kamera(t){target=t;$('kameraBolum').hidden=false;if(!window.isSecureContext){alert('Kamera için HTTPS bağlantısı gerekli');return}if(!window.Html5Qrcode){alert('Kamera kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin.');return}try{await kapat(false);$('kameraBolum').hidden=false;reader=new Html5Qrcode('reader');await reader.start({facingMode:'environment'},{fps:10,qrbox:{width:245,height:180}},async text=>{if(target==='raf'){$('raf').value=text;rafAc()}else{$('krl').value=text}await kapat()})}catch(e){alert('Kamera açılamadı: '+e.message)}}
async function kapat(hide=true){if(reader){try{if(reader.isScanning)await reader.stop()}catch(e){}try{reader.clear()}catch(e){}reader=null}if(hide)$('kameraBolum').hidden=true}
function kaydet(){let id=$('krl').value.trim(),adet=$('adet').value;if(!id||adet===''||!Number.isInteger(Number(adet))||Number(adet)<0){alert('KRL ve geçerli adet girin');return}if(records.some(r=>r.krl===id)){alert('Bu KRL zaten kayıtlı');return}records.push({raf:'123',lokasyon:'a1-1',stok:$('stok').value,krl:id,adet:Number(adet),tarih:new Date().toISOString()});localStorage.setItem('barcxSayim123',JSON.stringify(records));$('krl').value='';$('adet').value='';$('sonuc').textContent='Kayıt eklendi';listele()}
function listele(){$('toplam').textContent='('+records.length+' KRL, '+records.reduce((a,r)=>a+r.adet,0)+' adet)';$('liste').replaceChildren();records.forEach(r=>{let li=document.createElement('li');li.textContent=r.stok+' | '+r.krl+' | '+r.adet+' adet';$('liste').append(li)})}listele();
function csv(){let lines=['Raf;Lokasyon;Stok;KRL;Adet',...records.map(r=>[r.raf,r.lokasyon,r.stok,r.krl,r.adet].join(';'))];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='barcX_sayim.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
